name: hamareCRM

services:
  app:
    build: .
    container_name: hamareCRM-app
    ports:
      - "8088:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hamareCRM-net
    restart: unless-stopped

  db:
    image: mariadb:10.4
    container_name: hamareCRM-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: hamarecrm
      MYSQL_USER: sail
      MYSQL_PASSWORD: password
    volumes:
      - hamareCRM_db_data:/var/lib/mysql
    networks:
      - hamareCRM-net
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  hamareCRM_db_data:

networks:
  hamareCRM-net:
    driver: bridge
